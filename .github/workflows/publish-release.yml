name: Publish AniScale release

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful mobile build workflow run ID
        required: true
        type: string
      version:
        description: Release version without the v prefix
        required: true
        default: 1.9.0
        type: string

permissions:
  actions: read
  contents: write

jobs:
  publish:
    name: Publish APK and IPA
    runs-on: ubuntu-latest
    steps:
      - name: Check out AniScale
        uses: actions/checkout@v4

      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: AniScale-android-apk
          path: dist/android
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}

      - name: Download unsigned iOS IPA
        uses: actions/download-artifact@v4
        with:
          name: AniScale-unsigned-ipa
          path: dist/ios
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}

      - name: Prepare named release files
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          mv dist/android/app-release.apk "dist/AniScale-Android-v${VERSION}.apk"
          mv dist/ios/AniScale-unsigned.ipa "dist/AniScale-iOS-unsigned-v${VERSION}.ipa"
          cd dist
          sha256sum "AniScale-Android-v${VERSION}.apk" \
            "AniScale-iOS-unsigned-v${VERSION}.ipa" > SHA256SUMS.txt

      - name: Write release notes
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          cat > release-notes.md <<EOF
          ## AniScale ${VERSION} — faster Android AI and working history

          This release fixes Android model-memory failures, reduces processing overhead, sharpens video output, and makes image and video history persistent and reopenable.

          ### Video engines

          - **AniScale Fusion** — anime and stylized 3D; the quality-first default.
          - **AniScale Render** — fully rendered 3D and CGI; stronger texture and edge recovery.
          - **AniScale Turbo** — compact anime-video models with native 2× and 4× paths for faster, cooler processing.

          ### Android

          - Only the selected model is kept in memory, preventing the previous Fusion failure on memory-constrained devices.
          - FP16 Vulkan acceleration is enabled where supported, with a bounded CPU fallback.
          - Turbo uses larger automatic GPU tiles and native 2×/4× models.
          - Video uses engine-specific AI working resolutions, native YUV conversion, edge refinement, full encoder-safe export dimensions, and original-audio remuxing.
          - Fusion, Render, and Turbo are selectable for images as well as video.

          ### Interface and history

          - Shared premium purple-blue glass styling and edge-to-edge layout on Android and iOS.
          - Image and video history persists across launches.
          - History entries can be filtered, reopened, played, shared, saved, or deleted.
          - Settings, About, model information, licences, and clear-history controls are functional.

          ### iPhone

          - Fusion, Render, and Turbo are bundled as Core ML models.
          - The IPA is unsigned and must be signed with your own Apple ID/certificate before installation.

          ### Privacy

          Image and video enhancement runs on the device. Media is not uploaded for processing.

          SHA-256 checksums are included in `SHA256SUMS.txt`.
          EOF

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          TAG="v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "AniScale ${TAG}" --notes-file release-notes.md
            gh release upload "$TAG" \
              "dist/AniScale-Android-v${VERSION}.apk" \
              "dist/AniScale-iOS-unsigned-v${VERSION}.ipa" \
              dist/SHA256SUMS.txt --clobber
          else
            gh release create "$TAG" \
              "dist/AniScale-Android-v${VERSION}.apk" \
              "dist/AniScale-iOS-unsigned-v${VERSION}.ipa" \
              dist/SHA256SUMS.txt \
              --target "${GITHUB_SHA}" \
              --title "AniScale ${TAG}" \
              --notes-file release-notes.md \
              --latest
          fi
