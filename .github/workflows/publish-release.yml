name: Publish AniScale release

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful mobile build workflow run ID
        required: true
        type: string
      version:
        description: Release version without the v prefix
        required: true
        default: 1.14.0
        type: string

permissions:
  actions: read
  contents: write

jobs:
  publish:
    name: Publish APK and IPA
    runs-on: ubuntu-latest
    steps:
      - name: Check out AniScale
        uses: actions/checkout@v4

      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: AniScale-android-apk
          path: dist/android
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}

      - name: Download unsigned iOS IPA
        uses: actions/download-artifact@v4
        with:
          name: AniScale-unsigned-ipa
          path: dist/ios
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}

      - name: Prepare named release files
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          mv dist/android/app-release.apk "dist/AniScale-Android-v${VERSION}.apk"
          mv dist/ios/AniScale-unsigned.ipa "dist/AniScale-iOS-unsigned-v${VERSION}.ipa"
          cd dist
          sha256sum "AniScale-Android-v${VERSION}.apk" \
            "AniScale-iOS-unsigned-v${VERSION}.ipa" > SHA256SUMS.txt

      - name: Write release notes
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          cat > release-notes.md <<EOF
          ## AniScale ${VERSION} — AniUltraAnime recurrent video SR

          This release replaces the Clean and untrained Ultra selectors with a real AnimeSR_v2 recurrent anime-video engine on Android and iPhone.

          ### AniUltraAnime

          - Official Apache-2.0 AnimeSR_v2 architecture and pretrained checkpoint.
          - Previous/current/next frame context instead of frame-independent enhancement.
          - Persistent previous 4× output and 64-channel recurrent hidden state.
          - Automatic state reset at detected scene cuts to prevent information leaking between shots.
          - Native 4× inference plus a high-quality 2× output option, matching the official AnimeSR design.
          - Fast and Best working-resolution modes with bounded memory and thermal backoff.
          - Android: dynamic-spatial ONNX model through ONNX Runtime Mobile.
          - iPhone: flexible-shape FP16 Core ML model using available Apple acceleration.
          - Original timestamps, FPS, aspect ratio, and audio are retained through the existing streaming video pipeline.

          ### Removed engines

          - AniScale Clean has been removed from the app.
          - The untrained AniUltraScale Experimental runtime and model assets have been removed from release builds.

          ### AniRealism status

          AniRealism's CDA-VSR runtime contract is documented, but CDA-VSR is not bundled in this public release because the current upstream repository does not contain the licence file named by its README. AniScale will not redistribute that checkpoint until applicable permission is published or supplied.

          ### Existing engines

          Fusion, Render, Turbo, and SuperUltra remain available. HEVC/H.264 output, original-audio remuxing, encoder-safe 4K fitting, local history, progress, cancellation, and the premium monochrome interface remain intact.

          ### Privacy

          The released app's image and video enhancement runs on the device. Media is not uploaded for processing.

          SHA-256 checksums are included in `SHA256SUMS.txt`.
          EOF

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          TAG="v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists. Choose a new version; published releases are immutable." >&2
            exit 1
          fi
          gh release create "$TAG" \
            "dist/AniScale-Android-v${VERSION}.apk" \
            "dist/AniScale-iOS-unsigned-v${VERSION}.ipa" \
            dist/SHA256SUMS.txt \
            --target "${GITHUB_SHA}" \
            --title "AniScale ${TAG}" \
            --notes-file release-notes.md \
            --latest
