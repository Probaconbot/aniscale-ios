name: Build unsigned iOS IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    name: Build AniScale for iPhone
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Check out AniScale
        uses: actions/checkout@v4

      - name: Install Flutter stable
        shell: bash
        run: |
          git clone --depth 1 --branch stable https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"

      - name: Show build environment
        shell: bash
        run: |
          "$RUNNER_TEMP/flutter/bin/flutter" --version
          xcodebuild -version

      - name: Resolve Flutter packages
        shell: bash
        run: flutter pub get

      - name: Analyze project
        shell: bash
        run: flutter analyze

      - name: Run tests
        shell: bash
        run: flutter test

      - name: Build unsigned iPhone app
        shell: bash
        run: flutter build ios --release --no-codesign

      - name: Package unsigned IPA
        shell: bash
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/Runner.app
          ditto -c -k --sequesterRsrc --keepParent Payload AniScale-unsigned.ipa
          unzip -t AniScale-unsigned.ipa

      - name: Upload AniScale IPA
        uses: actions/upload-artifact@v4
        with:
          name: AniScale-unsigned-ipa
          path: AniScale-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
