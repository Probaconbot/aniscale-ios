name: Build AniScale mobile releases

on:
  push:
    branches:
      - codex/cda-vsr-private-test
  workflow_dispatch:
    inputs:
      private_test:
        description: Keep build files in an unpublished draft release
        required: true
        type: boolean
        default: false
      version:
        description: Private test version label
        required: false
        type: string
        default: 1.15.0-cda-test.1

permissions:
  contents: write

jobs:
  build-ios:
    name: Build AniScale for iPhone
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Check out AniScale
        uses: actions/checkout@v4

      - name: Validate video training assets
        shell: bash
        run: |
          python3 -m compileall -q training
          python3 training/validate_assets.py

      - name: Install Flutter stable
        shell: bash
        run: |
          git clone --depth 1 --branch stable https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"

      - name: Show build environment
        shell: bash
        run: |
          "$RUNNER_TEMP/flutter/bin/flutter" --version
          xcodebuild -version

      - name: Resolve Flutter packages
        shell: bash
        run: flutter pub get

      - name: Generate AniScale app icons
        shell: bash
        run: dart run flutter_launcher_icons

      - name: Set up Python for the Core ML model
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Restore converted AniScale models
        id: coreml-cache
        uses: actions/cache@v4
        with:
          path: |
            ios/Runner/Models/RealESRGAN_anime_6B_266_fp16.mlpackage
            ios/Runner/Models/RealESRGAN_render_x4plus_266_fp16.mlpackage
            ios/Runner/Models/AniScale_turbo_animevideo_266_fp16.mlpackage
          key: coreml-fusion-render-ios15-266-${{ hashFiles('tools/convert_realesrgan_coreml.py') }}

      - name: Convert Real-ESRGAN for iPhone
        if: steps.coreml-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy<2" "torch==2.5.1" "coremltools==8.1"
          python tools/convert_realesrgan_coreml.py

      - name: Verify Core ML model exists
        shell: bash
        run: |
          test -f ios/Runner/Models/RealESRGAN_anime_6B_266_fp16.mlpackage/Manifest.json
          test -f ios/Runner/Models/RealESRGAN_render_x4plus_266_fp16.mlpackage/Manifest.json
          test -f ios/Runner/Models/AniScale_turbo_animevideo_266_fp16.mlpackage/Manifest.json

      - name: Restore AniUltraAnime recurrent runtime
        id: anime-vsr-cache
        uses: actions/cache@v4
        with:
          path: |
            ios/Runner/Models/AniUltraAnime_v2_recurrent.mlpackage
            android/app/src/main/assets/models/AniUltraAnime_v2_recurrent.onnx
          key: aniultraanime-v2-mobile-v1-${{ hashFiles('tools/convert_animesr_mobile.py') }}

      - name: Convert official AnimeSR v2 for Android and iPhone
        if: steps.anime-vsr-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy<2" "torch==2.5.1" "coremltools==8.1" "onnx==1.17.0" "gdown==5.2.0"
          mkdir -p "$RUNNER_TEMP/animesr-weights" build/aniultraanime ios/Runner/Models android/app/src/main/assets/models
          gdown --folder 'https://drive.google.com/drive/folders/1gwNTbKLUjt5FlgT6PQQnBz5wFzmNUX8g' \
            -O "$RUNNER_TEMP/animesr-weights"
          ANIME_CHECKPOINT="$(find "$RUNNER_TEMP/animesr-weights" -type f -name 'AnimeSR_v2.pth' -print -quit)"
          test -n "$ANIME_CHECKPOINT"
          echo "d0f29c8966b53718828bd424bbdc306e7ff0cbf6350beadaf8b5b2500b108548  $ANIME_CHECKPOINT" | shasum -a 256 -c -
          python tools/convert_animesr_mobile.py \
            --checkpoint "$ANIME_CHECKPOINT" \
            --output build/aniultraanime
          cp build/aniultraanime/AniUltraAnime_v2_recurrent.onnx \
            android/app/src/main/assets/models/
          cp -R build/aniultraanime/AniUltraAnime_v2_recurrent.mlpackage \
            ios/Runner/Models/

      - name: Verify AniUltraAnime recurrent assets
        shell: bash
        run: |
          test -f ios/Runner/Models/AniUltraAnime_v2_recurrent.mlpackage/Manifest.json
          test -f android/app/src/main/assets/models/AniUltraAnime_v2_recurrent.onnx

      - name: Restore private AniRealism CDA-VSR models
        id: cda-vsr-cache
        uses: actions/cache@v4
        with:
          path: |
            ios/Runner/Models/AniRealism_cda_vsr_initializer.onnx
            ios/Runner/Models/AniRealism_cda_vsr_recurrent.onnx
            android/app/src/main/assets/models/AniRealism_cda_vsr_initializer.onnx
            android/app/src/main/assets/models/AniRealism_cda_vsr_recurrent.onnx
          key: anirealism-cda-vsr-fp32-v1

      - name: Convert audited CDA-VSR checkpoint for private testing
        if: steps.cda-vsr-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -o pipefail
          exec > >(tee "$RUNNER_TEMP/cda-convert.log") 2>&1
          trap 'status=$?; if [ "$status" -ne 0 ]; then message=$(grep -Ev "^[[:space:]]*$" "$RUNNER_TEMP/cda-convert.log" | tail -n 1 | sed "s/%/%25/g; s/\r/%0D/g; s/\n/%0A/g"); echo "::error title=CDA-VSR conversion failed::$message"; fi' EXIT
          python -m pip install --upgrade pip
          git clone https://github.com/ajccarlson/flux-fidelity.git "$RUNNER_TEMP/flux-fidelity"
          git -C "$RUNNER_TEMP/flux-fidelity" checkout 03acb0f8f8e0f1c8219a8ab0e842a0efcc74b18c
          git clone https://github.com/sspBIT/CDA-VSR.git "$RUNNER_TEMP/CDA-VSR"
          git -C "$RUNNER_TEMP/CDA-VSR" checkout 5707d997759996f19521c3beaddfb3d1ea965d44
          # The audited adapter's canonical source identity was recorded with
          # CRLF bytes. Normalize only this temporary checkout so the same
          # source passes its exact cross-platform identity check on macOS.
          perl -pi -e 's/\r?\n/\r\n/g' "$RUNNER_TEMP/CDA-VSR/basicsr/archs/cdavsr_arch.py"
          echo "0defb80e5fcbaa2abd0eb9cbc4f4f2050a68e94fa6f743aa48a785cc734fd87b  $RUNNER_TEMP/CDA-VSR/basicsr/archs/cdavsr_arch.py" | shasum -a 256 -c -
          echo "afc8745b890289ae421c500279d9ccf2a27c92cf3e71133b20840c7816e86d3e  $RUNNER_TEMP/CDA-VSR/pretrained_models/best.pth" | shasum -a 256 -c -
          python -m pip install -r "$RUNNER_TEMP/flux-fidelity/tools/cda-vsr/requirements.txt"
          python "$RUNNER_TEMP/flux-fidelity/tools/cda-vsr/cda_tool.py" export \
            --source "$RUNNER_TEMP/CDA-VSR" \
            --checkpoint "$RUNNER_TEMP/CDA-VSR/pretrained_models/best.pth" \
            --height 16 \
            --width 16 \
            --out-dir "$RUNNER_TEMP/cda-export"
          mkdir -p ios/Runner/Models android/app/src/main/assets/models
          cp "$RUNNER_TEMP/cda-export/cda-vsr-initializer.onnx" \
            ios/Runner/Models/AniRealism_cda_vsr_initializer.onnx
          cp "$RUNNER_TEMP/cda-export/cda-vsr-recurrent.onnx" \
            ios/Runner/Models/AniRealism_cda_vsr_recurrent.onnx
          cp "$RUNNER_TEMP/cda-export/cda-vsr-initializer.onnx" \
            android/app/src/main/assets/models/AniRealism_cda_vsr_initializer.onnx
          cp "$RUNNER_TEMP/cda-export/cda-vsr-recurrent.onnx" \
            android/app/src/main/assets/models/AniRealism_cda_vsr_recurrent.onnx

      - name: Verify private AniRealism CDA-VSR models
        shell: bash
        run: |
          test -s ios/Runner/Models/AniRealism_cda_vsr_initializer.onnx
          test -s ios/Runner/Models/AniRealism_cda_vsr_recurrent.onnx
          test -s android/app/src/main/assets/models/AniRealism_cda_vsr_initializer.onnx
          test -s android/app/src/main/assets/models/AniRealism_cda_vsr_recurrent.onnx

      - name: Restore SuperUltra Core ML models
        id: superultra-coreml-cache
        uses: actions/cache@v4
        with:
          path: |
            ios/Runner/Models/SuperUltra_span_x2_fp16.mlpackage
            ios/Runner/Models/SuperUltra_span_x4_fp16.mlpackage
            ios/Runner/Models/SuperUltra_span_anime_x2_fp16.mlpackage
          key: superultra-span-coreml-v1-${{ hashFiles('tools/convert_span_coreml.py') }}

      - name: Convert official SPAN checkpoints for iPhone
        if: steps.superultra-coreml-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy<2" "torch==2.5.1" "coremltools==8.1" "spandrel==0.4.1"
          mkdir -p "$RUNNER_TEMP/span-pth" ios/Runner/Models
          curl -L --fail -o "$RUNNER_TEMP/span-pth/spanx2_ch48.pth" \
            https://objectstorage.us-phoenix-1.oraclecloud.com/n/ax6ygfvpvzka/b/open-modeldb-files/o/2x-spanx2-ch48.pth
          curl -L --fail -o "$RUNNER_TEMP/span-pth/spanx4_ch48.pth" \
            https://objectstorage.us-phoenix-1.oraclecloud.com/n/ax6ygfvpvzka/b/open-modeldb-files/o/4x-spanx4-ch48.pth
          curl -L --fail -o "$RUNNER_TEMP/span-pth/2xHFA2kSPAN.safetensors" \
            'https://huggingface.co/Phips/2xHFA2kSPAN/resolve/main/2xHFA2kSPAN.safetensors?download=true'
          echo "0b20caeea7af5507ec3bdc63ff5a141a28506279d2cfec909c417ecb308d3f93  $RUNNER_TEMP/span-pth/spanx2_ch48.pth" | shasum -a 256 -c -
          echo "c79e716b8eb24182c1d7fcc74fa10ae074bdb34fee7c6e67c73053ff5498c667  $RUNNER_TEMP/span-pth/spanx4_ch48.pth" | shasum -a 256 -c -
          echo "616666ffaa9ccdf604e3d6b98bf1ec32c6ed08c4d36da7fed1d013843e5a45e9  $RUNNER_TEMP/span-pth/2xHFA2kSPAN.safetensors" | shasum -a 256 -c -
          python tools/convert_span_coreml.py \
            --x2 "$RUNNER_TEMP/span-pth/spanx2_ch48.pth" \
            --x4 "$RUNNER_TEMP/span-pth/spanx4_ch48.pth" \
            --anime-x2 "$RUNNER_TEMP/span-pth/2xHFA2kSPAN.safetensors" \
            --output ios/Runner/Models

      - name: Verify SuperUltra Core ML models
        shell: bash
        run: |
          test -f ios/Runner/Models/SuperUltra_span_x2_fp16.mlpackage/Manifest.json
          test -f ios/Runner/Models/SuperUltra_span_x4_fp16.mlpackage/Manifest.json
          test -f ios/Runner/Models/SuperUltra_span_anime_x2_fp16.mlpackage/Manifest.json

      - name: Analyze project
        shell: bash
        run: flutter analyze

      - name: Run tests
        shell: bash
        run: flutter test

      - name: Build unsigned iPhone app
        shell: bash
        run: flutter build ios --release --no-codesign

      - name: Package unsigned IPA
        shell: bash
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/Runner.app
          ditto -c -k --sequesterRsrc --keepParent Payload AniScale-unsigned.ipa
          unzip -t AniScale-unsigned.ipa

      - name: Upload AniScale IPA
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs.private_test }}
        uses: actions/upload-artifact@v4
        with:
          name: AniScale-unsigned-ipa
          path: AniScale-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Use Java 17 for Android
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android ncnn and AniScale models
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/ncnn" "$RUNNER_TEMP/realesrgan" "$RUNNER_TEMP/span"
          curl -L --fail -o "$RUNNER_TEMP/ncnn.zip" \
            https://github.com/Tencent/ncnn/releases/download/20260526/ncnn-20260526-android-vulkan.zip
          echo "26909c92eed35afed4a966b5e9e503fcb0a529691ea3f910ec2c94a4fff52804  $RUNNER_TEMP/ncnn.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/ncnn.zip" -d "$RUNNER_TEMP/ncnn"
          mkdir -p android/app/src/main/cpp/ncnn-android-vulkan
          cp -R "$RUNNER_TEMP/ncnn/ncnn-20260526-android-vulkan/." \
            android/app/src/main/cpp/ncnn-android-vulkan/

          curl -L --fail -o "$RUNNER_TEMP/realesrgan.zip" \
            https://github.com/xinntao/Real-ESRGAN/releases/download/v0.2.5.0/realesrgan-ncnn-vulkan-20220424-ubuntu.zip
          echo "e5aa6eb131234b87c0c51f82b89390f5e3e642b7b70f2b9bbe95b6a285a40c96  $RUNNER_TEMP/realesrgan.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/realesrgan.zip" -d "$RUNNER_TEMP/realesrgan"
          mkdir -p android/app/src/main/assets/models
          cp "$RUNNER_TEMP/realesrgan/models/realesrgan-x4plus-anime.param" android/app/src/main/assets/models/
          cp "$RUNNER_TEMP/realesrgan/models/realesrgan-x4plus-anime.bin" android/app/src/main/assets/models/
          cp "$RUNNER_TEMP/realesrgan/models/realesrgan-x4plus.param" android/app/src/main/assets/models/
          cp "$RUNNER_TEMP/realesrgan/models/realesrgan-x4plus.bin" android/app/src/main/assets/models/
          cp "$RUNNER_TEMP/realesrgan/models/realesr-animevideov3-x2.param" android/app/src/main/assets/models/
          cp "$RUNNER_TEMP/realesrgan/models/realesr-animevideov3-x2.bin" android/app/src/main/assets/models/
          cp "$RUNNER_TEMP/realesrgan/models/realesr-animevideov3-x4.param" android/app/src/main/assets/models/
          cp "$RUNNER_TEMP/realesrgan/models/realesr-animevideov3-x4.bin" android/app/src/main/assets/models/

          curl -L --fail -o "$RUNNER_TEMP/span.zip" \
            https://github.com/TNTwise/SPAN-ncnn-vulkan/releases/download/20240831-055257/span-ncnn-vulkan-20240831-055257-linux.zip
          echo "d30b7bf59a30cad37202ca097c97043a3669f9a616e3572cc06c7adb98af00ce  $RUNNER_TEMP/span.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/span.zip" -d "$RUNNER_TEMP/span"
          SPAN_ROOT="$RUNNER_TEMP/span/span-ncnn-vulkan-20240831-055257-linux"
          cp "$SPAN_ROOT/models/spanx2_ch48.param" android/app/src/main/assets/models/
          cp "$SPAN_ROOT/models/spanx2_ch48.bin" android/app/src/main/assets/models/
          cp "$SPAN_ROOT/models/spanx4_ch48.param" android/app/src/main/assets/models/
          cp "$SPAN_ROOT/models/spanx4_ch48.bin" android/app/src/main/assets/models/
          cp "$SPAN_ROOT/custom_models/2xHFA2kSPAN_27k.param" \
            android/app/src/main/assets/models/superultra-anime-x2.param
          cp "$SPAN_ROOT/custom_models/2xHFA2kSPAN_27k.bin" \
            android/app/src/main/assets/models/superultra-anime-x2.bin

          test -s android/app/src/main/assets/models/spanx2_ch48.param
          test -s android/app/src/main/assets/models/spanx2_ch48.bin
          test -s android/app/src/main/assets/models/spanx4_ch48.param
          test -s android/app/src/main/assets/models/spanx4_ch48.bin
          test -s android/app/src/main/assets/models/superultra-anime-x2.param
          test -s android/app/src/main/assets/models/superultra-anime-x2.bin

      - name: Build Android APK
        shell: bash
        run: flutter build apk --release

      - name: Upload AniScale APK
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs.private_test }}
        uses: actions/upload-artifact@v4
        with:
          name: AniScale-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Create unpublished private test draft
        if: ${{ github.event_name == 'push' || inputs.private_test }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TEST_VERSION: ${{ inputs.version || '1.15.0-cda-test.1' }}
        run: |
          set -euo pipefail
          test -n "$TEST_VERSION"
          IOS_FILE="AniScale-iOS-unsigned-v${TEST_VERSION}.ipa"
          ANDROID_FILE="AniScale-Android-v${TEST_VERSION}.apk"
          cp AniScale-unsigned.ipa "$IOS_FILE"
          cp build/app/outputs/flutter-apk/app-release.apk "$ANDROID_FILE"
          shasum -a 256 "$IOS_FILE" "$ANDROID_FILE" > SHA256SUMS.txt
          cat > "$RUNNER_TEMP/private-test-notes.md" <<'NOTES'
          Private AniScale evaluation build. This release is an unpublished draft and is visible only to repository collaborators.

          - Adds AniRealism Test using CDA-VSR recurrent initializer/frame graphs.
          - Preserves recurrent state between frames and resets at detected scene cuts.
          - Uses decoded-frame motion/residual estimates for this first mobile test.
          - Raises AniUltraAnime working resolution to preserve substantially more linework and texture.
          - Includes unsigned iOS IPA and Android APK.

          CDA-VSR upstream licensing is not specified. These binaries are for private evaluation only and must not be published or redistributed.
          NOTES
          gh release create "v${TEST_VERSION}" \
            "$IOS_FILE" "$ANDROID_FILE" SHA256SUMS.txt \
            --draft \
            --target "${GITHUB_SHA}" \
            --title "AniScale ${TEST_VERSION} — Private CDA-VSR Test" \
            --notes-file "$RUNNER_TEMP/private-test-notes.md"
